# Reusable secret-scanning workflow: gitleaks plus an owner-identity gate.
#
# Caller, in each repo's .github/workflows/secret-scan.yml:
#
#   name: secret-scan
#   on: [push, pull_request]
#   jobs:
#     scan:
#       uses: <owner>/ci-config/.github/workflows/secret-scan.yml@main
#       secrets: inherit
#
# `secrets: inherit` is what passes IDENTITY_PATTERN through. Without it the identity gate
# fails closed with an explicit message rather than silently scanning for nothing.
#
# The gitleaks ruleset (.gitleaks.toml) is vendored into each repo and scanned from the
# caller's own checkout, so a repo can allowlist its own false positives.
name: secret-scan
on:
  workflow_call:
    inputs:
      gitleaks-config:
        description: "Path to the repo-local .gitleaks.toml (vendored per repo)."
        type: string
        required: false
        default: .gitleaks.toml
      identity-include:
        description: >-
          Glob passed to grep --include for the identity gate. Defaults to Go sources, which is
          where committed identity has actually turned up. Widen per repo if it has another
          language whose source ships.
        type: string
        required: false
        default: "*.go"
    secrets:
      IDENTITY_PATTERN:
        description: >-
          Extended regex of owner-identifying strings that must never appear in source: email,
          personal domain, NAS path prefixes. Passed as a secret rather than written here so
          this workflow carries no identity of its own and can live in a public repo. Supplied
          per repo; `secrets: inherit` in the caller is enough.
        required: false
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run gitleaks
        env:
          CFG: ${{ inputs.gitleaks-config }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            dir --config "/repo/$CFG" --no-banner --redact --exit-code 1 .

  identity-gate:
    # gitleaks catches secrets; owner identity (email, domain, NAS paths) is not a secret, so
    # it is guarded separately. The pattern itself arrives as a secret, so this file names
    # nobody and nothing about where anything runs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: No owner identity in source
        env:
          PATTERN: ${{ secrets.IDENTITY_PATTERN }}
          INCLUDE: ${{ inputs.identity-include }}
        run: |
          # Fails closed. An unset pattern would make `grep -E ''` match every line, so the
          # alternative to erroring here is a gate that looks green while checking nothing.
          if [ -z "${PATTERN:-}" ]; then
            echo "::error::IDENTITY_PATTERN is not set. Add the secret to this repository and" \
                 "make sure the caller passes 'secrets: inherit'."
            exit 1
          fi
          if grep -rniE "$PATTERN" --include="$INCLUDE" .; then
            echo "::error::owner identity present in source — keep it out; source it from config"
            exit 1
          fi
          echo "identity gate: clean"
